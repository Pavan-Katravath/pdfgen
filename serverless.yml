service: pdf-generation-serverless

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:AWS_REGION, ''}
  stage: ${env:STAGE, 'local'}
  timeout: 300
  memorySize: 1024
  
  environment:
    S3_BUCKET: ${env:S3_BUCKET, ''}
    AWS_REGION: ${env:AWS_REGION, ''}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID, ''}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY, ''}
    S3_ENDPOINT_URL: ${env:S3_ENDPOINT_URL, ''}
    S3_FORCE_PATH_STYLE: ${env:S3_FORCE_PATH_STYLE, ''}
    FSR_REATTEMPT_TIMEOUT: ${env:FSR_REATTEMPT_TIMEOUT, ''}
    PRESIGNED_URL_EXPIRE: ${env:PRESIGNED_URL_EXPIRE, ''}
    ENABLE_VERTIV_LOGS: ${env:ENABLE_VERTIV_LOGS, ''}
  
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:GetObjectVersion
      Resource: "arn:aws:s3:::${env:S3_BUCKET, ''}/*"
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"

functions:
  generatePDF:
    handler: src/handlers/generatePDF.handler
    description: Generate PDF reports for different product groups
    events:
      - http:
          path: api/v1/notification.report
          method: post
          cors: true
      - http:
          path: api/v1/notification.report
          method: options
          cors: true
    reservedConcurrency: 10

  getPDF:
    handler: src/handlers/getPDF.handler
    description: Retrieve PDF reports from S3
    events:
      - http:
          path: api/v1/report.getpdf
          method: get
          cors: true
      - http:
          path: api/v1/report.getpdf
          method: options
          cors: true

  onepmFSR:
    handler: src/handlers/onepmFSR.handler
    description: Generate OnePM FSR reports with child PDFs
    events:
      - http:
          path: api/v1/report.onepmFSR
          method: post
          cors: true
      - http:
          path: api/v1/report.onepmFSR
          method: options
          cors: true
    reservedConcurrency: 5

  generateChecklist:
    handler: src/handlers/generateChecklist.handler
    description: Generate PM/Commissioning checklists (DPG/AIR/DCPS)
    events:
      - http:
          path: api/v1/report.generateChecklist
          method: post
          cors: true
      - http:
          path: api/v1/report.generateChecklist
          method: options
          cors: true

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    noPrependStageInUrl: true

package:
  patterns:
    - '!node_modules/.cache/**'
    - '!tests/**'
    - '!docs/**'
    - '!scripts/**'
    - '!.git/**'
    - '!.env*'
    - '!README.md'
    - '!.gitignore'
